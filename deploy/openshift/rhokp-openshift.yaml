# AI-Author: Codex (OpenAI model not exposed by runtime)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rhokp
  labels:
    app.kubernetes.io/name: rhokp
    app.kubernetes.io/part-of: rhokp-mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rhokp
  labels:
    app.kubernetes.io/name: rhokp
    app.kubernetes.io/part-of: rhokp-mcp
spec:
  replicas: 1
  progressDeadlineSeconds: 1800
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rhokp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rhokp
        app.kubernetes.io/part-of: rhokp-mcp
    spec:
      automountServiceAccountToken: false
      serviceAccountName: rhokp
      imagePullSecrets:
        - name: __REGISTRY_SECRET__
      terminationGracePeriodSeconds: 120
      containers:
        - name: rhokp
          image: __RHOKP_IMAGE__
          imagePullPolicy: IfNotPresent
          env:
            - name: ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: __ACCESS_KEY_SECRET__
                  key: ACCESS_KEY
            - name: ONLINE_VIEW
              value: "false"
            - name: SOLR_MEM
              value: "2g"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: "2"
              ephemeral-storage: 1Gi
              memory: 3Gi
            limits:
              cpu: "4"
              ephemeral-storage: 10Gi
              memory: 6Gi
          startupProbe:
            httpGet:
              path: /solr/portal/select?q=*%3A*&rows=0&wt=json
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /solr/portal/select?q=*%3A*&rows=0&wt=json
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          livenessProbe:
            httpGet:
              path: /solr/portal/select?q=*%3A*&rows=0&wt=json
              port: http
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: solr-data
              mountPath: /var/solr/data
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: solr-data
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: rhokp
  labels:
    app.kubernetes.io/name: rhokp
    app.kubernetes.io/part-of: rhokp-mcp
spec:
  selector:
    app.kubernetes.io/name: rhokp
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rhokp-mcp
  labels:
    app.kubernetes.io/name: rhokp-mcp
    app.kubernetes.io/part-of: rhokp-mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rhokp-mcp
  labels:
    app.kubernetes.io/name: rhokp-mcp
    app.kubernetes.io/part-of: rhokp-mcp
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rhokp-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rhokp-mcp
        app.kubernetes.io/part-of: rhokp-mcp
    spec:
      automountServiceAccountToken: false
      serviceAccountName: rhokp-mcp
      imagePullSecrets:
        - name: __REGISTRY_SECRET__
      terminationGracePeriodSeconds: 30
      containers:
        - name: mcp
          image: __MCP_IMAGE__
          imagePullPolicy: IfNotPresent
          env:
            - name: RHOKP_BASE_URL
              value: http://rhokp:8080
            - name: RHOKP_SOURCE_BASE_URL
              value: http://rhokp:8080
            - name: RHOKP_IMAGE_DIGEST
              value: __RHOKP_DIGEST__
            - name: RHOKP_SNAPSHOT_DATE
              value: __SNAPSHOT_DATE__
            - name: MCP_TOKEN_FILE
              value: /var/run/secrets/rhokp-mcp/token
          ports:
            - name: http
              containerPort: 18081
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 4
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: auth
              mountPath: /var/run/secrets/rhokp-mcp
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: auth
          secret:
            secretName: rhokp-mcp-server-auth
            defaultMode: 0440
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: rhokp-mcp
  labels:
    app.kubernetes.io/name: rhokp-mcp
    app.kubernetes.io/part-of: rhokp-mcp
spec:
  selector:
    app.kubernetes.io/name: rhokp-mcp
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rhokp-ingress
  labels:
    app.kubernetes.io/part-of: rhokp-mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rhokp
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rhokp-mcp
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rhokp-mcp-ingress
  labels:
    app.kubernetes.io/part-of: rhokp-mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rhokp-mcp
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rhokp-mcp
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: application-server
              app.kubernetes.io/part-of: openshift-lightspeed
      ports:
        - protocol: TCP
          port: 18081
